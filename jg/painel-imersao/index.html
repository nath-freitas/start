<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Imersão Coolhunting · Painel de campanha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --preto:#0e0e11; --amarelo:#faa323; --roxo:#6b35d9; --roxo-esc:#480ec1;
  --s1:#7040dd; --s2:#c47a00; --s3:#0b8ea3; --neutro:#9a93ad;
  --bg:#f4f4f7; --card:#fff; --linha:#e7e6ec;
  --ink:#16151c; --ink2:#55535f; --ink3:#88858f;
  --bom:#0f7a52; --ruim:#c0271d; --raio:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);
     font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 64px}

header{background:var(--preto);color:#fff;padding:20px 0 24px;border-bottom:3px solid var(--amarelo)}
header .wrap{padding-bottom:0}
.hrow{display:flex;flex-wrap:wrap;gap:18px 26px;align-items:center;justify-content:space-between}
.logo{flex:none;align-self:center;height:30px;width:auto;display:block}
.ficha{flex:1 1 auto;display:flex;flex-wrap:wrap;justify-content:center;gap:10px 40px;
       padding-left:26px;border-left:1px solid #2b2b32}
.ficha div{min-width:0}
.ficha .r{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#8d8a96}
.ficha .v{font-size:15px;font-weight:600;color:#fff;margin-top:1px}
.stamp{font-size:12px;color:#9c99a5;text-align:right;line-height:1.7}
.stamp b{color:#fff;font-weight:600}
td a{color:var(--roxo);text-decoration:none;border-bottom:1px solid #d8d1f2}
td a:hover{border-bottom-color:var(--roxo)}
.aviso{margin-top:12px;padding:9px 13px;border-radius:9px;font-size:12.5px;
       background:#fff4e2;color:#7a4a00;border:1px solid #f0d5a8}
.aviso.grave{background:#fdecea;color:#8c1d16;border-color:#f3c3bd}

section{margin-top:28px}
h2{font-size:15px;font-weight:600;margin:0 0 3px;letter-spacing:-.005em}
.nota{margin:0 0 12px;font-size:12.5px;color:var(--ink3)}
.card{background:var(--card);border:1px solid var(--linha);border-radius:var(--raio);padding:18px 20px}

/* Cinco por linha, na ordem que a leitura gerencial pede: a linha de cima é o
   resultado da campanha inteira, a de baixo é a mídia. */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:13px}
.kpis+.kpis{margin-top:13px}
@media(max-width:1040px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:720px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:430px){.kpis{grid-template-columns:1fr}}
.kpi{background:var(--card);border:1px solid var(--linha);border-radius:var(--raio);padding:15px 16px;min-width:0}
.kpi .rot{font-size:10.5px;font-weight:600;letter-spacing:.055em;text-transform:uppercase;color:var(--ink3)}
.kpi .val{font-size:27px;font-weight:700;letter-spacing:-.025em;margin:5px 0 1px;font-variant-numeric:tabular-nums}
.kpi .val small{font-size:14px;font-weight:600;color:var(--ink3);letter-spacing:0}
.kpi .pe.mini{font-size:11.5px}
.kpi .val.bom{color:var(--bom)} .kpi .val.ruim{color:var(--ruim)}
.kpi .pe{font-size:12.5px;color:var(--ink2)}
.kpi.destaque{border-color:#d9d6e2;box-shadow:0 1px 0 #e9e7ef}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600}
.tag.bom{color:var(--bom)} .tag.ruim{color:var(--ruim)}
.barra{position:relative;height:7px;border-radius:99px;background:#eceaf2;margin-top:11px}
.barra i{position:absolute;left:0;top:0;height:100%;border-radius:99px;
         background:linear-gradient(90deg,var(--roxo-esc),var(--roxo))}
.barra u{position:absolute;top:-3px;width:2px;height:13px;background:var(--ink2);border-radius:2px}

.funis{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:20px}
.funis>div{min-width:0}
.funis>div+div{border-left:1px solid var(--linha);padding-left:20px}
@media(max-width:900px){
  .funis{grid-template-columns:1fr;gap:22px}
  .funis>div+div{border-left:0;padding-left:0;border-top:1px solid var(--linha);padding-top:20px}
}
.fhead{font-size:14px;font-weight:600;letter-spacing:-.005em}
.fsub{margin:3px 0 4px;font-size:12.5px;color:var(--ink2);display:flex;flex-wrap:wrap;
      align-items:center;gap:3px 9px}
.frod{margin-top:6px;border-top:1px solid var(--linha);padding-top:9px;
      font-size:12.5px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:3px 18px}
.frod b{font-weight:600;color:var(--ink)}
.efic{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;
      background:var(--linha);border:1px solid var(--linha);border-radius:11px;overflow:hidden;margin-top:16px}
.efic div{background:#fbfbfc;padding:12px 14px;display:flex;flex-direction:column}
.efic .r{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.efic .v{font-size:21px;font-weight:700;letter-spacing:-.02em;padding-top:4px;margin-top:auto;
         font-variant-numeric:tabular-nums}

.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.grid3{grid-template-columns:1fr}}
@media(max-width:860px){.grid2{grid-template-columns:1fr}}
.pz{display:flex;flex-direction:column;align-items:center}
.pzleg{width:100%;margin-top:12px;display:flex;flex-direction:column;gap:7px;font-size:12.5px}
.pzleg span{display:flex;align-items:center;gap:8px}
.pzleg .nome{flex:1;color:var(--ink2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pzleg .qtd{font-weight:600;font-variant-numeric:tabular-nums}
.pzleg .pc{color:var(--ink3);font-variant-numeric:tabular-nums;min-width:46px;text-align:right}
.chip{width:11px;height:11px;border-radius:3px;flex:none}
.chip.tracejado{height:0;border-top:2px dashed #9a93ad;border-radius:0}
.vazio{padding:40px 0;color:var(--ink3);font-size:12.5px;text-align:center}

.chart{width:100%;display:block;overflow:visible}
.legenda{display:flex;flex-wrap:wrap;gap:16px;margin:0 0 6px;font-size:12.5px;color:var(--ink2)}
.legenda span{display:inline-flex;align-items:center;gap:6px}

.tw{overflow-x:auto;margin:0 -20px;padding:0 20px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid #f2f1f5;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:180px}
thead th{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);
         border-bottom:1px solid var(--linha);cursor:pointer;user-select:none}
thead th:hover{color:var(--roxo)}
tbody tr:hover{background:#faf9fc}
tbody tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;border-top:1px solid var(--linha);border-bottom:0;padding-top:11px}
td.forte{font-weight:600}
.mut{color:var(--ink3)}
.nw{white-space:nowrap}
.pilula{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:600}
.pilula.bom{background:#e4f4ec;color:var(--bom)}
.pilula.ruim{background:#fdecea;color:var(--ruim)}
.selo{display:inline-block;padding:1px 7px;border-radius:5px;font-size:10.5px;font-weight:600;
      letter-spacing:.03em;background:#f0eefa;color:#5b3fa8}

#tip{position:fixed;z-index:50;pointer-events:none;opacity:0;transition:opacity .1s;
     background:#1b1b21;color:#fff;font-size:12px;line-height:1.55;padding:8px 11px;border-radius:8px;
     box-shadow:0 8px 24px rgba(10,8,20,.32);white-space:nowrap}
#tip b{font-weight:600}
#tip .k{color:#b8b4c6}

@media(max-width:760px){
  .ficha{justify-content:flex-start;padding-left:0;border-left:0;flex-basis:100%}
  .stamp{text-align:left;flex-basis:100%}
}
@media(max-width:640px){
  .kpi .val{font-size:27px}
  th:first-child,td:first-child{min-width:150px}
}
footer{margin-top:34px;font-size:12px;color:var(--ink3);line-height:1.75}
footer b{color:var(--ink2);font-weight:600}
.carregando{padding:60px 0;text-align:center;color:var(--ink3)}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="hrow">
      <img class="logo" src="img/catapulta-amarelo.png" alt="Catapulta de Ideias">
      <div class="ficha">
        <div><div class="r">Cliente</div><div class="v" id="fCliente">—</div></div>
        <div><div class="r">Campanha</div><div class="v" id="fCampanha">—</div></div>
        <div><div class="r">Objetivo</div><div class="v" id="fObjetivo">—</div></div>
      </div>
      <div class="stamp">
        <span id="periodo">—</span><br>
        Dados de <b id="upd">—</b><br>
        <span style="opacity:.72">mídia e vendas na mesma leitura · atualiza de hora em hora</span>
      </div>
    </div>
  </div>
</header>

<div class="wrap">
  <div id="aviso"></div>
  <div id="app" class="carregando">Carregando os dados…</div>
</div>

<div id="tip"></div>

<script>
/* ============================== utilidades ============================== */
const NS='http://www.w3.org/2000/svg';
const S1='#7040dd', S2='#c47a00', S3='#0b8ea3', NEU='#9a93ad', REF='#9a93ad';
const PIE=[S1,S2,S3,'#c2417a','#2f8f4e','#4a6bd8','#a1642c'];
const el=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
const $=s=>document.querySelector(s);
const nf=n=>n==null?'—':Number(n).toLocaleString('pt-BR');
const n2=n=>n==null?'—':Number(n).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const mf=n=>n==null?'—':'R$ '+Number(n).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const m0=n=>n==null?'—':'R$ '+Number(n).toLocaleString('pt-BR',{maximumFractionDigits:0});
const pf=(n,d=1)=>n==null?'—':Number(n).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d})+'%';
const xf=n=>n==null?'—':Number(n).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'×';
const dm=s=>{const p=String(s).split('-');return p[2]+'/'+p[1];};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const compacto=n=>n==null?'—':(n>=10000?(n/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil':nf(n));

const tip=$('#tip');
function mostraTip(ev,html){tip.innerHTML=html;tip.style.opacity=1;movaTip(ev);}
function movaTip(ev){
  const r=tip.getBoundingClientRect();
  let x=ev.clientX+14, y=ev.clientY-r.height-12;
  if(x+r.width>innerWidth-8) x=ev.clientX-r.width-14;
  if(y<8) y=ev.clientY+18;
  tip.style.left=x+'px';tip.style.top=y+'px';
}
function escondeTip(){tip.style.opacity=0;}
function liga(node,html){
  node.addEventListener('mouseenter',e=>mostraTip(e,html));
  node.addEventListener('mousemove',movaTip);
  node.addEventListener('mouseleave',escondeTip);
}
function escalaBonita(v){
  if(!(v>0))return 1;
  const p=Math.pow(10,Math.floor(Math.log10(v))), n=v/p;
  return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p;
}

/* ============================== funil ============================== */
/* Forma afunilada fixa. A magnitude está nos números e na % de passagem — a
   largura é ilustrativa, senão a última etapa some (7 mil impressões x 15 vendas). */
function grafFunil(host,etapas){
  host.innerHTML='';
  const W=host.clientWidth||680;
  const estreito=W<620;
  const fW=Math.min(estreito?W*0.52:W*0.54,430);
  const colX=fW+(estreito?18:40);
  const bandaH=estreito?64:70, gap=3, topo=26;
  const n=etapas.length, H=topo+n*bandaH+10, cx=fW/2;
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H,class:'chart'});

  const defs=el('defs'); const lg=el('linearGradient',{id:'gfun-'+host.id,x1:0,y1:0,x2:0,y2:1});
  lg.appendChild(el('stop',{offset:'0%','stop-color':'#5a25c9'}));
  lg.appendChild(el('stop',{offset:'100%','stop-color':'#8a5ce8'}));
  defs.appendChild(lg); svg.appendChild(defs);

  const f=i=>1-(i/n)*0.62;
  const meia=i=>f(i)*fW/2;

  svg.appendChild(el('ellipse',{cx,cy:topo,rx:meia(0),ry:11,fill:'#4a1cb0'}));
  svg.appendChild(el('ellipse',{cx,cy:topo,rx:meia(0)-9,ry:7,fill:'#37138a'}));

  etapas.forEach((e,i)=>{
    const y=topo+i*bandaH, y2=y+bandaH-gap;
    const a=meia(i), b=meia(i+1);
    const g=el('g');
    g.appendChild(el('path',{d:`M${cx-a} ${y} L${cx+a} ${y} L${cx+b} ${y2} L${cx-b} ${y2} Z`,
                             fill:`url(#gfun-${host.id})`}));
    const t1=el('text',{x:cx,y:y+22,'text-anchor':'middle','font-size':estreito?11:12,
                        'font-weight':500,fill:'rgba(255,255,255,.82)'});
    t1.textContent=(estreito && e.curto) ? e.curto : e.nome; g.appendChild(t1);
    const t2=el('text',{x:cx,y:y+(estreito?48:51),'text-anchor':'middle','font-size':estreito?21:25,
                        'font-weight':800,fill:'#fff','letter-spacing':'-0.02em'});
    t2.textContent=compacto(e.valor); g.appendChild(t2);
    liga(g,`<b>${esc(e.nome)}</b><br><span class="k">Total</span> ${nf(e.valor)}`+
           (e.pct!=null?`<br><span class="k">Da etapa anterior</span> ${pf(e.pct)}`:''));
    svg.appendChild(g);

    const ym=y+(bandaH-gap)/2;
    const bordaX=cx+(a+b)/2;
    svg.appendChild(el('line',{x1:bordaX+6,x2:colX-10,y1:ym,y2:ym,stroke:'#e2e0e8','stroke-width':1}));
    const r1=el('text',{x:colX,y:ym-13,'font-size':10.5,'font-weight':600,fill:'#88858f','letter-spacing':'.05em'});
    r1.textContent=e.m1[0].toUpperCase(); svg.appendChild(r1);
    const v1=el('text',{x:colX,y:ym+6,'font-size':estreito?15:17,'font-weight':700,fill:'#16151c'});
    v1.textContent=e.m1[1]; svg.appendChild(v1);
    const v2=el('text',{x:colX,y:ym+23,'font-size':11.5,'font-weight':500,fill:'#55535f'});
    v2.textContent=e.m2[0]+' '+e.m2[1]; svg.appendChild(v2);
  });
  host.appendChild(svg);
}

/* ============================== rosca ============================== */
function grafPizza(host,itens,rotulo){
  host.innerHTML='';
  const total=itens.reduce((s,d)=>s+(d.valor||0),0);
  if(!total){host.innerHTML='<div class="vazio">Sem venda nesta quebra ainda.</div>';return;}
  const D=176, r=78, ri=48, c=D/2;
  const svg=el('svg',{viewBox:`0 0 ${D} ${D}`,width:D,height:D,style:'display:block'});
  let ang=-Math.PI/2;
  itens.filter(d=>d.valor>0).forEach(d=>{
    const frac=d.valor/total, da=frac*Math.PI*2, a2=ang+da;
    const p=(rr,a)=>[c+rr*Math.cos(a),c+rr*Math.sin(a)];
    let path;
    if(frac>0.9999){
      path=`M${c-r} ${c} A${r} ${r} 0 1 1 ${c+r} ${c} A${r} ${r} 0 1 1 ${c-r} ${c} Z
            M${c-ri} ${c} A${ri} ${ri} 0 1 0 ${c+ri} ${c} A${ri} ${ri} 0 1 0 ${c-ri} ${c} Z`;
    }else{
      const grande=da>Math.PI?1:0;
      const [x1,y1]=p(r,ang), [x2,y2]=p(r,a2), [x3,y3]=p(ri,a2), [x4,y4]=p(ri,ang);
      path=`M${x1} ${y1} A${r} ${r} 0 ${grande} 1 ${x2} ${y2} L${x3} ${y3} A${ri} ${ri} 0 ${grande} 0 ${x4} ${y4} Z`;
    }
    const no=el('path',{d:path,fill:d.cor,stroke:'#fff','stroke-width':2,'fill-rule':'evenodd'});
    liga(no,`<b>${esc(d.rot)}</b><br><span class="k">Vendas</span> ${nf(d.valor)} · ${pf(frac*100)}`);
    svg.appendChild(no);
    ang=a2;
  });
  const t=el('text',{x:c,y:c-2,'text-anchor':'middle','font-size':25,'font-weight':800,fill:'#16151c'});
  t.textContent=nf(total); svg.appendChild(t);
  const t2=el('text',{x:c,y:c+16,'text-anchor':'middle','font-size':11,'font-weight':600,
                      fill:'#88858f','letter-spacing':'.05em'});
  t2.textContent=rotulo||'VENDAS'; svg.appendChild(t2);
  host.appendChild(svg);

  const leg=document.createElement('div'); leg.className='pzleg';
  leg.innerHTML=itens.map(d=>`<span><i class="chip" style="background:${d.cor}"></i>
    <span class="nome">${esc(d.rot)}</span><span class="qtd">${nf(d.valor)}</span>
    <span class="pc">${pf(d.valor/total*100)}</span></span>`).join('');
  host.appendChild(leg);
}

/* ============================== barras e linhas ============================== */
function eixos(svg,W,H,P,max,ticks,fmtY){
  for(let i=0;i<=ticks;i++){
    const v=max*i/ticks, y=H-P.b-(H-P.t-P.b)*(i/ticks);
    svg.appendChild(el('line',{x1:P.l,x2:W-P.r,y1:y,y2:y,stroke:i?'#f1f0f4':'#e4e2ea','stroke-width':1}));
    const t=el('text',{x:P.l-8,y:y+4,'text-anchor':'end','font-size':11,fill:'#88858f'});
    t.textContent=fmtY(v);svg.appendChild(t);
  }
}
function rotulosX(svg,rows,W,H,P,passo){
  const n=rows.length, larg=(W-P.l-P.r)/n;
  rows.forEach((r,i)=>{
    if(i%passo && i!==n-1)return;
    const t=el('text',{x:P.l+larg*(i+.5),y:H-P.b+17,'text-anchor':'middle','font-size':11,fill:'#88858f'});
    t.textContent=dm(r.data);svg.appendChild(t);
  });
}
/* Barras empilhadas: orgânico embaixo, pago em cima — a leitura que a Nath faz
   todo dia é "quanto do dia veio de mídia". */
function grafBarras(host,rows,op){
  host.innerHTML='';
  const W=host.clientWidth||640, H=op.altura||240, P={t:14,r:12,b:26,l:48};
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H,class:'chart'});
  const max=escalaBonita(Math.max(1,...rows.map(r=>op.series.reduce((s,c)=>s+(r[c.chave]||0),0))));
  eixos(svg,W,H,P,max,4,op.fmtY||nf);
  const n=rows.length, larg=(W-P.l-P.r)/n, bw=Math.max(3,Math.min(46,larg-4));
  rows.forEach((r,i)=>{
    let base=0;
    op.series.forEach(c=>{
      const v=r[c.chave]||0; if(!v) return;
      const alt=(H-P.t-P.b)*(v/max);
      const y=H-P.b-(H-P.t-P.b)*(base/max)-alt;
      svg.appendChild(el('rect',{x:P.l+larg*i+(larg-bw)/2,y,width:bw,height:Math.max(2,alt),rx:3,fill:c.cor}));
      base+=v;
    });
    const hit=el('rect',{x:P.l+larg*i,y:P.t,width:larg,height:H-P.t-P.b,fill:'transparent'});
    liga(hit,op.tip(r)); svg.appendChild(hit);
  });
  rotulosX(svg,rows,W,H,P,Math.ceil(n/8));
  host.appendChild(svg);
}
function grafLinhas(host,rows,op){
  host.innerHTML='';
  const W=host.clientWidth||640, H=op.altura||240, P={t:14,r:12,b:26,l:48};
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H,class:'chart'});
  let bruto=0;
  op.series.forEach(s=>rows.forEach(r=>{const v=r[s.chave];if(v!=null&&v>bruto)bruto=v;}));
  if(op.ref!=null) bruto=Math.max(bruto,op.ref);
  const max=escalaBonita(Math.max(bruto*1.05,1));
  eixos(svg,W,H,P,max,4,op.fmtY||nf);
  const n=rows.length, larg=(W-P.l-P.r)/Math.max(1,n), X=i=>P.l+larg*(i+.5), Y=v=>H-P.b-(H-P.t-P.b)*(v/max);
  if(op.ref!=null){
    const y=Y(op.ref);
    svg.appendChild(el('line',{x1:P.l,x2:W-P.r,y1:y,y2:y,stroke:REF,'stroke-width':2,'stroke-dasharray':'5 4'}));
    const t=el('text',{x:W-P.r,y:y-7,'text-anchor':'end','font-size':11,'font-weight':600,fill:'#66636f'});
    t.textContent=op.refRotulo;svg.appendChild(t);
  }
  op.series.forEach(s=>{
    const pts=rows.map((r,i)=>[i,r[s.chave]]).filter(p=>p[1]!=null);
    if(!pts.length)return;
    const d=pts.map((p,k)=>(k?'L':'M')+X(p[0])+' '+Y(p[1])).join(' ');
    svg.appendChild(el('path',{d,fill:'none',stroke:s.cor,'stroke-width':2,'stroke-linejoin':'round',
      'stroke-linecap':'round','stroke-dasharray':s.tracejado?'5 4':''}));
    if(pts.length<=40) pts.forEach(p=>svg.appendChild(
      el('circle',{cx:X(p[0]),cy:Y(p[1]),r:4,fill:s.cor,stroke:'#fff','stroke-width':2})));
  });
  rows.forEach((r,i)=>{
    const hit=el('rect',{x:P.l+larg*i,y:P.t,width:larg,height:H-P.t-P.b,fill:'transparent'});
    liga(hit,op.tip(r)); svg.appendChild(hit);
  });
  rotulosX(svg,rows,W,H,P,Math.ceil(n/8));
  host.appendChild(svg);
}

let DADOS=null;

function cor(valor,alvo,menorMelhor){
  if(valor==null||alvo==null)return '';
  return (menorMelhor ? valor<=alvo : valor>=alvo) ? 'bom' : 'ruim';
}
function selo(valor,alvo,menorMelhor,txtBom,txtRuim){
  const c=cor(valor,alvo,menorMelhor);
  if(!c)return '<span class="mut">—</span>';
  return c==='bom' ? `<span class="tag bom">&#9679; ${txtBom}</span>`
                   : `<span class="tag ruim">&#9650; ${txtRuim}</span>`;
}
function pilula(valor,alvo,menorMelhor=true,fmt=mf){
  if(valor==null)return '<span class="mut">—</span>';
  const bom = menorMelhor ? valor<=alvo : valor>=alvo;
  return `<span class="pilula ${bom?'bom':'ruim'}">${fmt(valor)}</span>`;
}
const CORES={'Tráfego pago':S1,'Orgânico':S3,'Sem origem':NEU};
function pinta(itens){
  let i=0;
  return itens.map(d=>Object.assign({},d,{cor:CORES[d.rot]||(d.neutro?NEU:PIE[i++%PIE.length])}));
}

        <th data-c="cpm">CPM</th><th data-c="ctr">CTR</th><th data-c="cpc">CPC</th>
        <th data-c="lpv">LP View</th><th data-c="checkouts">Checkouts</th>
        <th data-c="inscricoes">Inscrições</th><th data-c="conv_lpv">Conv. vs LP View</th>
        <th data-c="faturamento">Faturamento</th><th data-c="cpa">CPA</th>
      </tr></thead><tbody></tbody>
    </table></div></div>
  </section>`}

  <footer>
    <b>Como cada número é apurado.</b><br>
    <b>Venda</b> = transação aprovada na plataforma, lida por webhook. Reembolso, chargeback e
    cancelamento saem do total assim que chegam${k.estornos?` (${nf(k.estornos)} até agora, ${mf(k.fat_estornado)})`:''}.
    O painel guarda só o esqueleto da transação: nenhum nome, e-mail, telefone ou documento de comprador.<br>
    <b>Faturamento</b> = soma do valor BRUTO do produtor de cada venda — nunca quantidade × ticket, e
    nunca o total pago pelo comprador (que traz juros de parcelamento e não chega ao produtor).<br>
    <b>Pago × orgânico</b> = pelo <code>sck</code> do checkout: <code>utm_medium</code> numérico é o id do
    conjunto e marca tráfego pago; palavra (bio, stories, direct) é orgânico; sem <code>sck</code> legível
    conta como orgânico por decisão da campanha.<br>
    <b>Imposto</b> = todo valor de mídia (investimento, CPM, CPC, CPA) sai multiplicado por
    ${(1+c.tax).toLocaleString('pt-BR',{minimumFractionDigits:3})}, ou seja ${pf(c.tax*100)} sobre o valor do
    Gerenciador. O teto de ${mf(alvo)} por inscrição já é um valor com imposto.<br>
    <b>Verde e vermelho</b> = comparação com o ritmo do período já transcorrido: no dia
    ${k.dias_decorridos} de ${k.dias_janela} de mídia, a meta proporcional é ${nf(k.esperado_pagas)}
    inscrições pagas. CPA e ROAS são comparados direto com o alvo.<br>
    <b>Order bump</b> = extra levado no mesmo checkout da inscrição: mesmo pedido, ou até
    ${nf(k.bump_janela_min)} minutos de distância (a plataforma nem sempre irmãiza as duas transações).
    Extra comprado depois disso é venda avulsa e não conta como conversão de bump.<br>
    <b>Atualização</b> = mídia e venda são lidas juntas, de hora em hora, e a página mostra a hora
    dessa leitura. A venda que entra entre uma leitura e a próxima fica represada até a leitura
    seguinte — de propósito: CPA e ROAS só fecham se as duas metades descreverem o mesmo instante.
    Painel da Catapulta de Ideias.
  </footer>`;

  desenha();
  addEventListener('resize',()=>{clearTimeout(window.__t);window.__t=setTimeout(desenha,180);});

  if(!semMidia){
    let ordem={c:'investido',asc:false};
    const corpo=$('#tads tbody');
    function pintaAds(){
      const linhas=DADOS.anuncios.slice().sort((a,b)=>{
        const x=a[ordem.c],y=b[ordem.c];
        if(x==null&&y==null)return 0; if(x==null)return 1; if(y==null)return -1;
        return (typeof x==='string'?String(x).localeCompare(y,'pt-BR'):x-y)*(ordem.asc?1:-1);
      });
      corpo.innerHTML=linhas.map(a=>`<tr>
        <td class="forte">${a.permalink
            ? `<a href="${esc(a.permalink)}" target="_blank" rel="noopener">${esc(a.nome)}</a>`
            : esc(a.nome)}
          ${a.conjuntos>1?`<span class="selo">${nf(a.conjuntos)} conjuntos</span>`:''}</td>
        <td>${mf(a.investido)}</td>
        <td>${mf(a.cpm)}</td><td>${pf(a.ctr,2)}</td><td>${mf(a.cpc)}</td>
        <td>${nf(a.lpv)}</td><td>${nf(a.checkouts)}</td>
        <td class="forte">${nf(a.inscricoes)}</td><td>${pf(a.conv_lpv,2)}</td>
        <td>${mf(a.faturamento)}</td>
        <td>${pilula(a.cpa,a.cpa_alvo)}</td></tr>`).join('');
    }
    document.querySelectorAll('#tads thead th').forEach(th=>th.addEventListener('click',()=>{
      const cc=th.dataset.c;
      ordem = ordem.c===cc ? {c:cc,asc:!ordem.asc} : {c:cc,asc:cc==='nome'||cc==='conjunto'};
      pintaAds();
    }));
    pintaAds();
  }
}

function desenha(){
  const d=DADOS, k=d.kpi, c=d.cfg;
  const s=d.serie;                                    // série inteira: a venda orgânica começa antes da mídia
  const sm=d.serie.filter(r=>r.data>=c.start);        // só o período com mídia

  (d.funis||[]).filter(f=>f.impressoes>0).forEach(f=>{
    const host=$('#funil-'+f.chave);
    if(!host)return;
    const fatia=k.investido>0?f.investido/k.investido*100:null;
    grafFunil(host,[
      {nome:'Impressions', valor:f.impressoes, pct:null,
       m1:['CPM',mf(f.cpm)],                      m2:['Da verba',pf(fatia)]},
      {nome:'Clicks',      valor:f.cliques,   pct:f.ctr,
       m1:['CPC',mf(f.cpc)],                      m2:['CTR',pf(f.ctr,2)]},
      {nome:'LP View',     valor:f.lpv,       pct:f.connect_rate,
       m1:['Custo por LP View',mf(f.custo_lpv)],  m2:['Connect Rate',pf(f.connect_rate)]},
      {nome:'Checkout iniciado', curto:'Checkout', valor:f.checkouts, pct:f.lpv_checkout,
       m1:['Custo por checkout',mf(f.custo_checkout)], m2:['LPV → checkout',pf(f.lpv_checkout)]},
      {nome:'Inscrições pagas',  curto:'Inscrições', valor:f.inscricoes, pct:f.checkout_venda,
       m1:['CPA',mf(f.cpa)],                      m2:['Checkout → venda',pf(f.checkout_venda)]},
    ]);
  });

  grafPizza($('#pz1'),pinta(d.roscas.origem),'VENDAS');
  grafPizza($('#pz2'),pinta(d.roscas.organico),'ORGÂNICAS');
  grafPizza($('#pz3'),pinta(d.roscas.produto),'VENDAS');

  grafBarras($('#c1'),s,{series:[{chave:'inscr_org',cor:S3},{chave:'inscr_pago',cor:S1}],fmtY:nf,
    tip:r=>`<b>${dm(r.data)}</b><br><span class="k">Inscrições</span> ${nf(r.inscricoes)}
            <br><span class="k">Pago</span> ${nf(r.inscr_pago)}
            <br><span class="k">Orgânico</span> ${nf(r.inscr_org)}
            <br><span class="k">Transações no dia</span> ${nf(r.vendas)}
            <br><span class="k">Faturamento</span> ${mf(r.faturamento)}
            <br><span class="k">Investido</span> ${mf(r.investido)}`});

  grafLinhas($('#c2'),sm,{series:[{chave:'cpa',cor:S1}],
    fmtY:v=>'R$ '+v.toLocaleString('pt-BR',{maximumFractionDigits:0}),
    ref:c.cpa_target,refRotulo:'teto '+m0(c.cpa_target),
    tip:r=>`<b>${dm(r.data)}</b><br><span class="k">CPA do dia</span> ${mf(r.cpa)}
            <br><span class="k">CPA acumulado</span> ${mf(r.cpa_acum)}
            <br><span class="k">Investido</span> ${mf(r.investido)}
            <br><span class="k">Inscrições pagas</span> ${nf(r.inscr_pago)}`});

  const dias=Math.max(1,Math.round((new Date(c.capture_end+'T00:00:00')-new Date(c.campanha_start+'T00:00:00'))/86400000)+1);
  const alvoDia=k.meta_total/dias;
  const base=new Date(c.campanha_start+'T00:00:00');
  const s3=s.map(r=>{
    const n=Math.round((new Date(r.data+'T00:00:00')-base)/86400000)+1;
    return Object.assign({},r,{ritmo:n>0?Math.round(alvoDia*Math.min(n,dias)):null});
  });
  grafLinhas($('#c3'),s3,{altura:260,
    series:[{chave:'acumulado',cor:S1},{chave:'ritmo',cor:REF,tracejado:true}],fmtY:nf,
    tip:r=>`<b>${dm(r.data)}</b><br><span class="k">Inscrições acumuladas</span> ${nf(r.acumulado)}
            <br><span class="k">Ritmo necessário</span> ${nf(r.ritmo)}
            <br><span class="k">Pagas acumuladas</span> ${nf(r.acumulado_pago)}`});
}

/* ============================== carga ==============================
   Sem botão de "atualizar agora": ele prometia o que a página não pode
   entregar. O dado novo depende da leitura do Meta, que acontece de hora em
   hora fora do navegador — um clique aqui só devolveria o mesmo número com
   ares de recém-chegado. O carimbo do topo diz a verdade. */
function carrega(){
  $('#app').className='carregando';
  $('#app').textContent='Carregando os dados…';
  fetch('data.php',{credentials:'same-origin'})
    .then(r=>r.ok?r.json():r.json().then(j=>Promise.reject(j.erro||('HTTP '+r.status))))
    .then(render)
    .catch(e=>{$('#app').className='carregando';
      $('#app').innerHTML=`<div class="aviso grave">Não foi possível carregar: ${esc(e)}</div>`;});
}
carrega();
</script>
</body>
